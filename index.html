<script>

}
function perf(pool,sel,cA,cV,cF,all){
 const dv=S.div,bsel=S.brand,s2=x=>sum(pool,x),whole=!sel&&S.area==='ALL'&&S.spv==='ALL'&&S.sf==='ALL';
 let tw=sel?sel.tw:whole?X.g.tw:[0,1,2,3].map(i=>s2(x=>x.tw[i])),aw=sel?sel.aw:whole?X.g.aw:[0,1,2,3].map(i=>s2(x=>x.aw[i]));
 let T=sel?sel.t:whole?X.g.t:s2(x=>x.t),Aa=sum(aw,x=>x);

 const dc=([k,l,c])=>{const [t,a]=dd(k),gap=Math.max(t-a,0);return{ini:l.slice(0,2).toUpperCase(),c,name:l,v:rp(a),p:pc(t?a/t:0),l1:'GAP TO 100%',l2:'GAP / HARI KERJA',g1:rp(gap),g2:rp(gap/n0(st().hari_kerja_sisa||19)),click:k}};

 if(dv!=='ALL'){const d=dd(dv);T=d[0];Aa=d[1];tw=[0,1,2,3].map(()=>T/4);aw=[Aa,0,0,0]}

 const title=bsel!=='ALL'?'SUB BRAND · '+bsel:dv==='ALL'?'PER DIVISI · TARGET VS AKTUAL BULAN INI (klik divisi untuk lihat brand)':'SEMUA SUB BRAND · '+DV.find(d=>d[0]===dv)[1].toUpperCase()+' · AKTUAL & GAP OA';
 const F=[['area','AREA',cA,all.concat(AREAS.filter(([v])=>X.s.some(x=>m(x,v,S.spv,S.sf))))],['spv','SUPERVISOR',cV,all.concat([...new Set(X.s.map(x=>x.spv))].filter(v=>X.s.some(x=>m(x,S.area,v,S.sf))).map(v=>[v,v]))],['spg','SALESMAN',sel?sel.k:'ALL',all.concat(pool.map(x=>[x.k,x.n]))],['sf','SALESFORCE',cF,all.concat(SFS.filter(v=>X.s.some(x=>m(x,S.area,S.spv,v))).map(v=>[v,v]))],['div','DIVISI',dv,all.concat(DV.map(v=>[v[0],v[1]]))],['brand','SUB BRAND',bsel,all.concat(X.BN.filter(b=>dv==='ALL'||X.DM[b]===dv).map(b=>[b,b]))],['per','PERIODE','p',[['p',st().periode||'']]]];
 const mx=Math.max(...tw,...aw,1)*1.05,raw=mx/6,mag=Math.pow(10,Math.floor(Math.log10(raw))),nn=raw/mag,stp=(nn<=1?1:nn<=2?2:nn<=5?5:10)*mag,top=stp*6;

 <div class="row">

  <div style="display:flex;align-items:center;gap:14px"><span style="width:52px;font-size:13px;color:var(--mut2)">Aktual</span><div class="bar" style="background:var(--nav);width:${Math.min(62,Aa/T*62)}%"></div><b>${rp(Aa)}</b></div>

 const sales=S.rmode==='sales',items=sales?R.slice().sort((a,b)=>a.rank-b.rank).map(r=>mk(r.n,r.spv+' · '+r.sf,[r],r.k,r.foto)):[...new Set(R.map(r=>r.spv))].map(v=>{const g=R.filter(r=>r.spv===v);return mk(v,g.length+' salesman',g,'','')}).sort((a,b)=>b.tot-a.tot);
 const mxT=Math.max(...items.map(x=>x.tot)),n=sales?3:4;

  <div style="font-size:15px;font-weight:800;margin-top:10px;overflow-wrap:anywhere">${esc(x.name)}</div><div style="font-size:12px;color:var(--mut)">${esc(x.role)}</div>${first?'<div style="margin-top:8px;padding:3px 16px;border-radius:999px;background:linear-gradient(90deg,#FDE68A,#F59E0B,#FDE68A);color:#3B2300;font-size:11px;font-weight:800;letter-spacing:.1em">★ JUARA 1 ★</div>':''}
  <div style="font-size:12px;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><span>Omset <b>${pc(x.pom)}</b></span><span>EC <b>${pc(x.pec)}</b></span><span>OA <b>${pc(x.poa)}</b></span></div><div style="font-size:11px;color:var(--mut);margin-top:6px">TOTAL POIN</div><div style="font-size:24px;font-weight:800;margin-bottom:10px">${pc(x.tot)}</div>
  <div style="width:100%;height:${[170,130,100,76][i]}px;background:${BG[i]};color:${fg};border-radius:10px 10px 0 0;box-shadow:inset 0 2px 0 rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800">${i+1}</div></div>`}).join('');
 const order=sales?[1,0,2]:[1,0,2,3],pods=items.slice(0,n).length?order.map(i=>pod.split('<div class="pc">').slice(1)[i]):[];
 const rows=items.map((x,i)=>`<tr><td><span class="rk" style="background:${i<3?RC[i]:'var(--pill)'};color:${i===2?'#fff':i<2?'#1F2937':'var(--ink)'}">${i+1}</span></td><td><b>${esc(x.name)}</b></td><td style="color:var(--mut)">${esc(x.role)}</td><td class="r">${rp(x.om)}</td><td class="r">${pc(x.pom)}</td><td class="r">${pc(x.pec)}</td><td class="r">${pc(x.poa)}</td><td class="r">${x.ir.toLocaleString('id-ID',{maximumFractionDigits:2})} / ${x.it.toLocaleString('id-ID',{maximumFractionDigits:1})}</td>${x.p.map(q=>`<td class="r">${pc(q)}</td>`).join('')}<td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:8px;background:var(--track);border-radius:4px"><div style="height:8px;border-radius:4px;background:var(--nav);width:${x.tot/mxT*100}%"></div></div><b>${pc(x.tot)}</b></div></td></tr>`).join('');
 return`<div class="row" style="align-items:center;justify-content:space-between"><div><div style="font-size:16px;font-weight:800">RANKING PRODUKTIVITAS PER ${sales?'SALESMAN':'SUPERVISOR'}</div><div style="font-size:12px;color:var(--mut)">${sales?R.length+' salesman, diurutkan dari Total POIN tertinggi':'4 supervisor, diurutkan dari rata-rata Total POIN timnya'} · ${esc(X.st.periode||'')}, update ${esc(X.st.update||'')}</div></div><div class="seg"><button class="${sales?'on':''}" onclick="act('rmode','sales')">Per Salesman</button><button class="${sales?'':'on'}" onclick="act('rmode','spv')">Per Supervisor</button></div></div>
 <div class="card pod" style="padding:22px 20px 0">${pods.map(p=>'<div class="pc">'+p).join('')}</div>
